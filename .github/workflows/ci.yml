name: CI
on:
  pull_request:
    branches: [develop, main, 'chore/GOV-001-repository-baseline']
  push:
    branches: [develop]

permissions:
  contents: read

# PR 迭代时取消同一 PR 的过期 run，立刻释放 runner；
# develop push 是合并验收证据（六项绿），每个 run 独立分组，永不取消、不排队。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # 仅 PR 事件运行（push 上跳过，下游 job 以 result == 'skipped' 放行全量）。
  # 分类原则：宁多跑不漏跑——未归类的路径走 other=true 触发全量。
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      web: ${{ steps.filter.outputs.web }}
      miniapp: ${{ steps.filter.outputs.miniapp }}
      policy: ${{ steps.filter.outputs.policy }}
      contract: ${{ steps.filter.outputs.contract }}
      ci: ${{ steps.filter.outputs.ci }}
      other: ${{ steps.filter.outputs.other }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'docs/03-database/**'
              # pet-boot 集成测试在本仓内启动 frontend-miniapp 的 node 链脚本（CFrontendHttpTest / MerchantApplicationLifecycleHttpTest）
              - 'frontend-miniapp/package.json'
              - 'frontend-miniapp/package-lock.json'
              - 'frontend-miniapp/tsconfig.json'
              - 'frontend-miniapp/src/consumer/tests/**'
              - 'frontend-miniapp/src/shared/tests/**'
            web:
              - 'frontend-admin/**'
              - 'backend/tools/**'
            miniapp:
              - 'frontend-miniapp/**'
              - 'backend/tools/**'
            policy:
              - 'backend/**'
              - 'docs/00-ssot/**'
              - 'docs/02-architecture/**'
              - 'docs/04-api/**'
              - 'docs/05-events/**'
              - 'docs/06-scheduler/**'
            contract:
              - 'e2e/**'
              - 'docs/00-ssot/**'
              - 'docs/04-api/**'
              # e2e/test_auth_contract.py 读取 planning/ccr/AUTH-001/examples.md
              - 'planning/ccr/**'
            ci:
              - '.github/workflows/**'
            other:
              - '**'
              - '!backend/**'
              - '!frontend-admin/**'
              - '!frontend-miniapp/**'
              - '!docs/**'
              - '!planning/**'
              - '!e2e/**'
              - '!.github/**'
              - '!**.md'
      - name: Record filter outcome
        env:
          BACKEND: ${{ steps.filter.outputs.backend }}
          WEB: ${{ steps.filter.outputs.web }}
          MINIAPP: ${{ steps.filter.outputs.miniapp }}
          POLICY: ${{ steps.filter.outputs.policy }}
          CONTRACT: ${{ steps.filter.outputs.contract }}
          CI: ${{ steps.filter.outputs.ci }}
          OTHER: ${{ steps.filter.outputs.other }}
        run: |
          echo "### CI path filter (PR only; push to develop always runs all jobs)" >> "$GITHUB_STEP_SUMMARY"
          echo "backend=$BACKEND web=$WEB miniapp=$MINIAPP policy=$POLICY contract=$CONTRACT ci=$CI other=$OTHER" >> "$GITHUB_STEP_SUMMARY"

  backend:
    needs: changes
    # push 到 develop 一律全量（合并验收证据）；PR 上按路径分类放行
    if: >-
      ${{ !cancelled() && (
      needs.changes.result == 'skipped' ||
      needs.changes.outputs.backend == 'true' ||
      needs.changes.outputs.ci == 'true' ||
      needs.changes.outputs.other == 'true' ) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: plat004-ci-isolated
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pplat004-ci-isolated"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      auth-redis:
        image: redis:7.4-alpine
        ports:
          - 16379:6379
        options: >-
          --health-cmd "redis-cli -e CONFIG SET save '' appendonly no && redis-cli -e ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=12
    env:
      PAYMENT_REFUND_MYSQL_URL: jdbc:mysql://127.0.0.1:3306/
      PAYMENT_REFUND_MYSQL_USER: root
      PAYMENT_REFUND_MYSQL_PASSWORD: plat004-ci-isolated
      PLAT004_MYSQL_URL: jdbc:mysql://127.0.0.1:3306/
      PLAT004_MYSQL_USER: root
      PLAT004_MYSQL_PASSWORD: plat004-ci-isolated
      PLAT003_MYSQL_URL: jdbc:mysql://127.0.0.1:3306/
      PLAT003_MYSQL_USER: root
      PLAT003_MYSQL_PASSWORD: plat004-ci-isolated
      USR001_MYSQL_URL: jdbc:mysql://127.0.0.1:3306/
      USR001_MYSQL_USER: root
      USR001_MYSQL_PASSWORD: plat004-ci-isolated
      MER001_MYSQL_URL: jdbc:mysql://127.0.0.1:3306/
      MER001_MYSQL_USER: root
      MER001_MYSQL_PASSWORD: plat004-ci-isolated
      OSSTEST_MYSQL_URL: jdbc:mysql://127.0.0.1:3306/
      OSSTEST_MYSQL_USER: root
      OSSTEST_MYSQL_PASSWORD: plat004-ci-isolated
      PLAT002_ID_MYSQL_URL: jdbc:mysql://127.0.0.1:3306/
      PLAT002_ID_MYSQL_USER: root
      PLAT002_ID_MYSQL_PASSWORD: plat004-ci-isolated
      AUTH_MYSQL_URL: jdbc:mysql://127.0.0.1:3306/
      AUTH_MYSQL_USER: root
      AUTH_MYSQL_PASSWORD: plat004-ci-isolated
      AUTH_REDIS_HOST: 127.0.0.1
      AUTH_REDIS_PORT: 16379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Check module dependencies
        run: python backend/tools/check-module-deps.py
      - name: Architecture source gate and negative fixtures
        run: |
          python -m unittest discover -s backend/tools -p 'test_*.py' -v
          python backend/tools/check-display-status.py
          python backend/tools/check-persistence-style.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
          cache: npm
          cache-dependency-path: frontend-miniapp/package-lock.json
      - run: npm install --global npm@10.9.8
      - name: Prepare frontend client for real backend integration test
        working-directory: frontend-miniapp
        run: npm ci
      - name: Maven verify
        run: mvn -B -f backend/pom.xml clean verify
      - name: Preserve actual backend evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/**/target/surefire-reports/
          if-no-files-found: error

  frontend-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      web: ${{ steps.inventory.outputs.web }}
      miniapp: ${{ steps.inventory.outputs.miniapp }}
    steps:
      - uses: actions/checkout@v4
      - id: inventory
        shell: bash
        run: |
          for pair in web:frontend-admin miniapp:frontend-miniapp; do
            kind=${pair%%:*}
            directory=${pair#*:}
            if test -f "$directory/package.json"; then
              echo "$kind=true" >> "$GITHUB_OUTPUT"
            else
              echo "$kind=false" >> "$GITHUB_OUTPUT"
              echo "### $kind: NOT_IMPLEMENTED — build/typecheck did not run" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          echo 'Inventory only. Web fixture Playwright results are reported by web-build. WeChat runtime and VIS are not executed in Linux CI; see QA-001 provenance for existing same-source platform evidence.' >> "$GITHUB_STEP_SUMMARY"

  web-build:
    needs: [changes, frontend-inventory]
    if: >-
      ${{ !cancelled() && needs.frontend-inventory.outputs.web == 'true' && (
      needs.changes.result == 'skipped' ||
      needs.changes.outputs.web == 'true' ||
      needs.changes.outputs.ci == 'true' ||
      needs.changes.outputs.other == 'true' ) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
          cache: npm
          cache-dependency-path: frontend-admin/package-lock.json
      - run: npm install --global npm@10.9.8
      - run: python backend/tools/run-frontend-gate.py web-build
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('frontend-admin/package-lock.json') }}
          restore-keys: playwright-chromium-${{ runner.os }}-
      - name: Install Playwright Chromium
        working-directory: frontend-admin
        run: npx playwright install --with-deps chromium
      # gate 已执行 npm ci + typecheck + vite build（产物在 dist 供 preview webServer 使用），
      # 这里直接跑 Playwright，不再经 npm test 重复 typecheck + vite build
      - name: WEB-001 WEB-002 PERM-005 private fixture smoke
        working-directory: frontend-admin
        run: npx playwright test
      - name: Record Web fixture scope
        run: echo 'PASS Web Playwright fixture smoke. Real Java API, RBAC, data scope and audit are NOT_EXECUTED.' >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve Web test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-fixture-test-results
          path: frontend-admin/test-results/
          if-no-files-found: error

  miniapp-weapp-build:
    needs: [changes, frontend-inventory]
    if: >-
      ${{ !cancelled() && needs.frontend-inventory.outputs.miniapp == 'true' && (
      needs.changes.result == 'skipped' ||
      needs.changes.outputs.miniapp == 'true' ||
      needs.changes.outputs.ci == 'true' ||
      needs.changes.outputs.other == 'true' ) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
          cache: npm
          cache-dependency-path: frontend-miniapp/package-lock.json
      - run: npm install --global npm@10.9.8
      - run: python backend/tools/run-frontend-gate.py miniapp-build

  repository-policy:
    needs: changes
    if: >-
      ${{ !cancelled() && (
      needs.changes.result == 'skipped' ||
      needs.changes.outputs.policy == 'true' ||
      needs.changes.outputs.ci == 'true' ||
      needs.changes.outputs.other == 'true' ) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Reject deprecated late-payment recovery design
        shell: bash
        run: |
          ! grep -R --exclude='*.docx' --exclude-dir='.git' -n "WAITING_APPOINTMENT_RESELECTION" backend docs/00-ssot docs/02-architecture docs/04-api docs/05-events docs/06-scheduler

  contract-smoke:
    needs: changes
    if: >-
      ${{ !cancelled() && (
      needs.changes.result == 'skipped' ||
      needs.changes.outputs.contract == 'true' ||
      needs.changes.outputs.ci == 'true' ||
      needs.changes.outputs.other == 'true' ) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: e2e/requirements.txt
      - run: python -m pip install -r e2e/requirements.txt
      - run: python e2e/contract_smoke.py
      - run: python -m unittest discover -s e2e -p 'test_*.py' -v
      - name: Record exact tested ref and tree
        run: |
          echo "PR head: ${{ github.event.pull_request.head.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Checkout commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "Checkout tree: $(git rev-parse HEAD^{tree})" >> "$GITHUB_STEP_SUMMARY"
