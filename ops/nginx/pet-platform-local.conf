# ==============================================================================
# 宠物平台 V1.0 本机统一反代网关模板（固定端口 127.0.0.1:8090）
# ------------------------------------------------------------------------------
# 用途：作为 NATAPP 等公网 HTTPS 隧道（以及本机同源联调）的唯一入口，统一承接：
#   1) 运营端前端静态页（/ -> frontend-admin/dist）
#   2) 运营端后端 API（/api/v1/admin/** -> 127.0.0.1:8080）
#   3) 小程序 C/M 后端 API（/api/v1/c/**、/api/v1/merchant/** -> 127.0.0.1:8080）
#   4) 拉卡拉 4 条 1009 验签回调（/api/v1/callbacks/lakala/** -> 127.0.0.1:8080）
#
# 使用步骤（Windows 推荐装于纯 ASCII 路径 C:\Tools\nginx）：
#   1. 在主 nginx.conf 的 http {} 中加入：
#        map_hash_bucket_size 64;
#        map $http_host $pet_admin_origin {
#            default              "http://127.0.0.1:8090";
#            "<PUBLIC_DOMAIN>"    "https://<PUBLIC_DOMAIN>";
#        }
#        include conf.d/*.conf;
#   2. 将本文件复制为 conf/conf.d/pet-platform.conf，并将 <PUBLIC_DOMAIN> 替换为实际公网域名；
#   3. Windows 如工作树路径含中文，用 mklink /J C:\Tools\nginx\html\pet-admin "<WORKTREE>\frontend-admin\dist"
#      建纯 ASCII 目录联接，然后执行 nginx -t && 启动 nginx。
# ==============================================================================

server {
    listen       127.0.0.1:8090;
    server_name  <PUBLIC_DOMAIN> localhost 127.0.0.1;

    charset utf-8;
    client_max_body_size 11m;

    # 安全合规：禁止将带一次性凭证的 read-grant URL 写入访问日志
    location ~* /read-grants/ {
        access_log off;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header Forwarded "";
    }

    # 运营端登录 2 条 attempt-bound GET 接口：后端强校验 Origin，同源浏览器 GET 需补发 Origin
    location ~ ^/api/v1/admin/auth/attempts/[1-9][0-9]*/(requirements|result)$ {
        if ($http_sec_fetch_site != "same-origin") {
            return 403;
        }
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Origin $pet_admin_origin;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header Forwarded "";
    }

    # 全部后端 API（运营 / 小程序 C&M / 拉卡拉 4 条 1009 验签回调），原始请求体与签名头无损透传
    # 注意：不能用 ^~，否则会短路上面的正则规则（/read-grants/ 关日志与 attempt GET 补 Origin）
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header Forwarded "";
        proxy_read_timeout 60s;
    }

    # 后端健康检查
    location = /actuator/health {
        proxy_pass http://127.0.0.1:8080/actuator/health;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
    }

    # 运营端静态页面（SPA）；开发期需要热更新时可临时替换为 proxy_pass http://127.0.0.1:5173;
    location = /index.html {
        root C:/Tools/nginx/html/pet-admin;
        add_header Cache-Control "no-cache";
    }

    location / {
        root C:/Tools/nginx/html/pet-admin;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
