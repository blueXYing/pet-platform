spring:
  application:
    name: pet-platform
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:pet_platform}?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: ${DB_USER:pet}
    password: ${DB_PASSWORD:pet}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
      # Private material and aftersale evidence uploads share this bounded multipart policy. Keep bytes out of the
      # container's ordinary temp directory; the controller/core enforce the same 10 MiB ceiling.
      file-size-threshold: 10MB
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  # Read-grant tokens are path credentials and must never enter container access logs.
  tomcat:
    accesslog:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-} requestId=%X{requestId:-}]"

# Platform capability switches. Per the 2026-10-16 deployment ruling (doc 35), every
# platform-owned capability face defaults ON and is decoupled from release events; only
# faces whose enablement hard-requires third-party credentials or deployment-specific
# opt-ins stay default-off (payment channels, OSS, real WeChat delivery, isolated
# migrations, session keys). Missing credentials fail closed (503) by design; see
# docs/08-engineering/21-部署开关组合清单-v1.0.md for the full dependency matrix.
pet:
  aftersale:
    enabled: false
    refund:
      enabled: false
    worker:
      enabled: false
    http:
      enabled: false
  schedule:
    query:
      # C-end minute-level bookable-slot read (41号): default ON per the 2026-10-16 ruling.
      enabled: true
      selection:
        # 36号 selection window query rides the query slice; default ON with it.
        enabled: true
    protection:
      # Shared reservation guard/facts/proof foundation: default ON. Boot-safe (no
      # external credentials); every guarded write domain depends on these beans.
      enabled: true
    command:
      # SCH-004 merchant schedule write side (service windows, staff availability windows,
      # capabilities, workbench reads). Default off; enabling additionally requires the
      # reservation protection foundation beans (pet.schedule.protection.enabled) and, for
      # the HTTP routes, pet.schedule.command.http.enabled. The V29 migration is a separate
      # explicit opt-in (migration-enabled + migration-database=schw001_*).
      enabled: false
      http:
        enabled: false
      migration-enabled: false
      migration-database:
  refund:
    application:
      enabled: false
      worker:
        enabled: false
      http:
        enabled: false
    # 2026-10-08 ruling: pre-service refund applications are automatic full approvals
    # (product hard rule 服务前退款自动全额). Default ON per the 2026-10-16 ruling; read only
    # when the refund-application kernel assembles.
    pre-service-auto-refund:
      enabled: true
    merchant:
      # Contract 57 M refund face (pending list/detail/approve/reject on the 49号 kernel):
      # off by default; enabling additionally requires pet.refund.application.enabled (the
      # RefundApplicationConfiguration validation fails closed otherwise).
      http:
        enabled: false
  review:
    # REV-001 review kernel + C face (10号 §3.14 + 07号 §7.7/§14): off by default; the kernel
    # additionally needs pet.auth.c.enabled for the real C session/order query slice, and the
    # HTTP routes ride pet.review.http.enabled on top of it.
    enabled: false
    http:
      enabled: false
    # REV-002 review appeal (SSOT §11.3 one-appeal-per-review; 56号; 06号 review_appeal table,
    # zero schema change). Off by default; appeal requires the review kernel plus the store
    # guard (pet.schedule.protection.enabled) and both real session domains (pet.auth.c /
    # pet.auth.admin); the HTTP routes (M reads/appeal + admin list/detail/decision) ride
    # pet.review.appeal.http.enabled on top of it.
    appeal:
      enabled: false
      http:
        enabled: false
  verification:
    completion:
      enabled: false
    credential:
      enabled: false
      http:
        enabled: false
    # K1 v0.2 staff-aware verification authority: default ON so the verification kernel,
    # when its credential chain goes live at deployment, starts with the staff path enabled
    # (owner path is tried first and keeps its semantics; merchant.staff-identity is
    # required and defaults ON as well).
    staff-identity:
      enabled: true
  merchant:
    application:
      # Merchant onboarding itself stays behind pet.merchant.application.enabled (it needs the
      # production Snowflake bean and open-city configuration); its station-notification
      # consumer defaults ON so approved/reviewed events dispatch as soon as the outbox runs.
      notifications-enabled: true
    staff:
      # Contract-54 invitation/member/grant station notifications: default ON (dispatched by
      # the outbox once pet.outbox.enabled=true).
      notifications-enabled: true
    staff-identity:
      # Contract 52 STAFF identity read kernel: default ON per the 2026-10-16 ruling.
      enabled: true
    staff-member:
      # Contract 54 invite-confirm binding (D1-a; verify-only catalog D2): off by default.
      # Requires pet.schedule.protection.enabled for the shared store guard; the employee
      # routes additionally require pet.auth.c.enabled. The V30 migration is a separate
      # opt-in (migration-enabled/migration-database, isolated staffb001_ databases only).
      enabled: ${STAFF_MEMBER_ENABLED:false}
  order:
    reschedule:
      enabled: false
      http:
        enabled: false
    merchant:
      enabled: false
      http:
        enabled: false
      worker:
        enabled: false
    auto-confirm:
      enabled: false
      worker:
        enabled: false
      repair:
        enabled: false
      inspection:
        enabled: false
  private-assets:
    enabled: ${PRIVATE_ASSETS_ENABLED:false}
  service:
    query:
      # C-end service catalog read: default ON per the 2026-10-16 ruling (boot-safe).
      enabled: true
    command:
      # SCH/SVC write side stays behind its kernel switch: it requires the production
      # Snowflake bean (pet.auth.admin.enabled) at boot.
      enabled: false
      http:
        enabled: false
      migration-enabled: false
      migration-database:
    review:
      # Service review station notifications: default ON (dispatched once the outbox runs).
      notifications-enabled: true
  store:
    query:
      # C-end store catalog (STR-D6): default ON per the 2026-10-16 ruling; goes live with
      # pet.auth.c.enabled (route security) at deployment.
      enabled: ${STORE_QUERY_ENABLED:true}
  encyclopedia:
    # Contract-62 public read face: default ON per the 2026-10-16 ruling (boot-safe).
    query:
      enabled: true
  admin:
    governance:
      http:
        # Contract-64 governance query face: default ON; assembles only with
        # pet.auth.admin.enabled (session keys), otherwise silently inert.
        enabled: true
    ops:
      http:
        # Contract-65 ops console face: default ON; assembles only with
        # pet.auth.admin.enabled, otherwise silently inert.
        enabled: true
  auth:
    c:
      enabled: ${AUTH_C_ENABLED:false}
      redis-host: ${AUTH_C_REDIS_HOST:}
      redis-port: ${AUTH_C_REDIS_PORT:6379}
      wechat:
        app-id: ${AUTH_WECHAT_APP_ID:}
        app-secret: ${AUTH_WECHAT_APP_SECRET:}
  # Contract 58 favorite/footprint C face (32号裁决第二节批次; 10号 §3.16): default ON per the
  # 2026-10-16 ruling. The face assembles only with pet.auth.c.enabled (real MINIAPP session)
  # plus both C catalog query slices (pet.service.query.enabled + pet.store.query.enabled, both
  # default ON) for target admission and list enrichment; the assembly fails closed when either
  # catalog is missing, so it goes live together with the C session domain at deployment.
  favtrack:
    http:
      enabled: true
