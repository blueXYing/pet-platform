# ==============================================================================
# 宠物平台 V1.0 后端公共配置（Single Source of Truth）
# ------------------------------------------------------------------------------
# 分层约定：
#   1. application.yml       公共默认值 + 所有敏感项/机器路径的环境变量唯一绑定入口
#   2. application-dev.yml   开发环境非敏感配置（SPRING_PROFILES_ACTIVE=dev）
#   3. application-test.yml  测试/SIT 环境非敏感配置（SPRING_PROFILES_ACTIVE=test）
#   4. application-prod.yml  生产环境非敏感配置（SPRING_PROFILES_ACTIVE=prod）
#   5. 环境变量 / .env.local 密钥、密码、证书与机器路径（模板见 ops/backend-secrets.env.example）
#
# 注意：本文件刻意不设默认 spring.profiles.active：
#   - 自动化单测默认跑最小上下文，不会误连外部依赖；
#   - 生产漏传 SPRING_PROFILES_ACTIVE 时不会静默落到 dev 配置。
# ==============================================================================

spring:
  application:
    name: pet-platform
  config:
    # 本地开发可选加载唯一 git-ignored 的 .env.local；生产直接由进程环境变量注入
    import: optional:file:./.env.local[.properties],optional:file:../.env.local[.properties]
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:pet_platform}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DB_USER:pet}
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
      # Keep bounded evidence bytes out of the container's ordinary temp directory.
      file-size-threshold: 10MB
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  # Read-grant tokens are path credentials and must never enter container access logs.
  tomcat:
    accesslog:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-} requestId=%X{requestId:-}]"

pet:
  # ---------- 统一对象存储（OSS，所有模块共享） ----------
  oss:
    endpoint: ${OSS_ENDPOINT:}
    region: ${OSS_REGION:}
    bucket: ${OSS_BUCKET:}
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    secret-access-key: ${OSS_SECRET_ACCESS_KEY:}
    public-base-url: ${OSS_PUBLIC_BASE_URL:}

  # ---------- 私有素材 / 入驻 / 目录 / 排期底座 ----------
  private-assets:
    enabled: false

  # ---------- 认证与会话（统一复用 REDIS_HOST/PORT/PASSWORD 与 WECHAT_MINI_APP_ID/SECRET） ----------
  auth:
    admin:
      enabled: false
      maintenance: false
      origin: ${ADMIN_AUTH_ORIGIN:}
      key-id: ${ADMIN_AUTH_KEY_ID:}
      mac-key-base64: ${ADMIN_AUTH_MAC_KEY_BASE64:}
      encryption-key-base64: ${ADMIN_AUTH_ENCRYPTION_KEY_BASE64:}
      audit-path: ${ADMIN_AUTH_AUDIT_PATH:}
      node-id: ${SNOWFLAKE_NODE_ID:1}
      redis-host: ${REDIS_HOST:localhost}
      redis-port: ${REDIS_PORT:6379}
      redis-password: ${REDIS_PASSWORD:}
    c:
      enabled: false
      redis-host: ${REDIS_HOST:localhost}
      redis-port: ${REDIS_PORT:6379}
      redis-password: ${REDIS_PASSWORD:}
      wechat:
        app-id: ${WECHAT_MINI_APP_ID:${AUTH_WECHAT_APP_ID:}}
        app-secret: ${WECHAT_MINI_APP_SECRET:${AUTH_WECHAT_APP_SECRET:}}

  # ---------- 业务参数默认值（非环境差异，跨环境一致） ----------
  usersettings:
    deletion:
      cooldown-days: 7
  coupon:
    grant:
      max-per-template: 10
  community:
    media:
      public-base-url: ${COMMUNITY_MEDIA_PUBLIC_BASE_URL:${OSS_PUBLIC_BASE_URL:}}
  marketing:
    asset:
      public-base-url: ${MARKETING_ASSET_PUBLIC_BASE_URL:${OSS_PUBLIC_BASE_URL:}}
      allow-http: false
    campaign:
      # 存量活动分类码清理完成后在对应环境开启
      category-validation:
        enabled: false
  service:
    category:
      icon-url-allow-http: false
    flash-price:
      enabled: false
  notification:
    delivery:
      # 外部微信订阅消息投递（待接入真实微信适配器后开启；站内通知不受影响）
      enabled: false

  # ---------- 交易与资金链保护密钥（仅环境变量注入，无明文默认） ----------
  order:
    merchant:
      protection-key: ${ORDER_MERCHANT_PROTECTION_KEY:}
  verification:
    credential:
      key-id: ${VERIFICATION_CREDENTIAL_KEY_ID:}
      encryption-key: ${VERIFICATION_CREDENTIAL_ENCRYPTION_KEY:}
      lookup-key: ${VERIFICATION_CREDENTIAL_LOOKUP_KEY:}
  refund:
    application:
      protection-key: ${REFUND_APPLICATION_PROTECTION_KEY:}
  aftersale:
    protection-key: ${AFTERSALE_PROTECTION_KEY:}

  # ---------- 支付与资金链（拉卡拉，统一开关 pet.payment.enabled） ----------
  payment:
    enabled: false
    dispatch:
      # SIT 或 PRODUCTION（由 application-dev/test/prod.yml 指定；空值启动失败）
      environment: ${LAKALA_ENV:}
      app-id: ${LAKALA_APP_ID:}
      merchant-serial: ${LAKALA_MERCHANT_SERIAL_NO:}
      merchant-private-key-path: ${LAKALA_MERCHANT_PRIVATE_KEY_PATH:}
      platform-serial: ${LAKALA_PLATFORM_CERT_SERIAL:}
      platform-certificate-path: ${LAKALA_PLATFORM_CERT_PATH:}
      parameter-key-path: ${PAYMENT_PARAM_AES_KEY_PATH:}
      out-org-code: ${LAKALA_OUT_ORG_CODE:}
      subject: ${LAKALA_SUBJECT:}
      request-ip: ${LAKALA_REQUEST_IP:}
      notify-url: ${LAKALA_PAY_NOTIFY_URL:}
    lakala:
      notification-certificate-path: ${LAKALA_NOTIFY_CERT_PATH:}
      channel-time-zone: ${LAKALA_CHANNEL_TIMEZONE:Asia/Shanghai}
      settle-type: 0
      platform:
        merchant-no: ${LAKALA_MERCHANT_NO:}
        term-no: ${LAKALA_TERM_NO:}
        sub-app-id: ${WECHAT_MINI_APP_ID:${AUTH_WECHAT_APP_ID:}}
    center:
      demo:
        # 仅开发/测试环境按需开启；PRODUCTION 环境下 guard 强制拒绝启动
        enabled: false
        max-amount: 0.01
