spring:
  application:
    name: pet-platform
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:pet_platform}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DB_USER:pet}
    password: ${DB_PASSWORD:pet}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
      # This is the only servlet multipart endpoint. Keep bounded evidence bytes out of the
      # container's ordinary temp directory; the controller/core enforce the same 10 MiB ceiling.
      file-size-threshold: 10MB
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  # Read-grant tokens are path credentials and must never enter container access logs.
  tomcat:
    accesslog:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-} requestId=%X{requestId:-}]"

# C-end (mini-program) auth slice. Off by default; when pet.auth.c.enabled=true the real
# WeChat provider additionally needs app-id/app-secret. Fill them in the git-ignored
# application-local.yml (copy application-local.yml.example) or via the environment
# variables below at deployment time. Never commit real credentials.
pet:
  private-assets:
    enabled: ${PRIVATE_ASSETS_ENABLED:false}
  auth:
    c:
      enabled: ${AUTH_C_ENABLED:false}
      redis-host: ${AUTH_C_REDIS_HOST:}
      redis-port: ${AUTH_C_REDIS_PORT:6379}
      wechat:
        app-id: ${AUTH_WECHAT_APP_ID:}
        app-secret: ${AUTH_WECHAT_APP_SECRET:}
  # Contract 58 favorite/footprint C face (32号裁决第二节批次; 10号 §3.16): default OFF
  # (35号 B-class blocker) — the face hard-requires both C catalog query slices
  # (pet.service.query.enabled + pet.store.query.enabled), which chain to the merchant
  # application kernel; it goes live together with the C session domain and the catalogs.
  favtrack:
    http:
      enabled: false
  # Contract-66 user settings hub / account-deletion C face (PRD 5.1.29; CCR-USR-DELETION-001
  # v0.2 cooling period): default OFF — the slice assembles only with pet.auth.c.enabled AND
  # pet.merchant.application.enabled (the OWNER-membership surface), composing the order and
  # aftersale leaf deletion-fact ports; missing ports are assembly errors, never fallbacks.
  # The cooling period is deployment configuration (v0.2 user ruling 2026-10-19: default 7
  # days, bounded 1..30); the durable expiry worker below is independently opt-in (SQL13).
  usersettings:
    http:
      enabled: false
    deletion:
      cooldown-days: ${DELETION_COOLDOWN_DAYS:7}
      worker:
        enabled: ${DELETION_WORKER_ENABLED:false}
  # Contract-67 feedback-ticket C face (PRD 5.1.28 complaint class; CCR-CS-FEEDBACK-001):
  # default OFF — assembles only with pet.auth.c.enabled; the write guard consumes the
  # user-owned active-status fact port.
  feedback:
    http:
      enabled: false
  # CCR-COM-001 community domain: public feed/detail/interactions + admin moderation.
  # Default OFF; migration only accepts an explicitly named com001_* database.
  community:
    enabled: ${COMMUNITY_ENABLED:false}
    c:
      http:
        enabled: ${COMMUNITY_C_HTTP_ENABLED:false}
    admin:
      http:
        enabled: ${COMMUNITY_ADMIN_HTTP_ENABLED:false}
    migration-enabled: ${COMMUNITY_MIGRATION_ENABLED:false}
    migration-database: ${COMMUNITY_MIGRATION_DATABASE:}
    media:
      public-base-url: ${COMMUNITY_MEDIA_PUBLIC_BASE_URL:}
  # Contract-71 marketing center (CCR-MKT-001): kernel + three HTTP faces, default OFF.
  # The kernel composes admin authorization, merchant store facts, coupon campaign facts and
  # the open-city catalog; missing owners fail closed 503 at call time, never open writes.
  marketing:
    enabled: ${MARKETING_ENABLED:false}
    admin:
      http:
        enabled: ${MARKETING_ADMIN_HTTP_ENABLED:false}
    merchant:
      http:
        enabled: ${MARKETING_MERCHANT_HTTP_ENABLED:false}
    c:
      http:
        enabled: ${MARKETING_C_HTTP_ENABLED:false}
    migration-enabled: ${MARKETING_MIGRATION_ENABLED:false}
    migration-database: ${MARKETING_MIGRATION_DATABASE:}
    asset:
      # Public base for uploaded artwork URLs; production must be HTTPS/CDN.
      public-base-url: ${MARKETING_ASSET_PUBLIC_BASE_URL:}
      # Local E2E only: permit http:// asset URLs (production stays HTTPS-only).
      allow-http: ${MARKETING_ASSET_ALLOW_HTTP:false}
  # Contract-72 coupon campaign/batch + active claim (CCR-MKT-001): default OFF.
  coupon:
    campaign:
      enabled: ${COUPON_CAMPAIGN_ENABLED:false}
      admin:
        http:
          enabled: ${COUPON_CAMPAIGN_ADMIN_HTTP_ENABLED:false}
      c:
        http:
          enabled: ${COUPON_CAMPAIGN_C_HTTP_ENABLED:false}
