pet:
  auth:
    admin:
      enabled: true
    c:
      enabled: true
  private-assets:
    enabled: true
  payment:
    enabled: true
    dispatch:
      environment: SIT
    lakala:
      settle-type: 1
    center:
      demo:
        enabled: true
  marketing:
    asset:
      allow-http: false
  service:
    category:
      icon-url-allow-http: false
    flash-price:
      enabled: true
