# ==============================================================================
# 测试环境非敏感配置（SPRING_PROFILES_ACTIVE=test）
# ------------------------------------------------------------------------------
# 与 dev / prod 装配完全一致的业务能力；拉卡拉默认对接 PRODUCTION 网关（通过环境变量
# 注入测试商户/测试证书，正式上线时替换为正式商户/正式证书），禁止 HTTP 素材与 DEMO。
# 注意：本文件面向部署测试环境，自动化单测不会激活 test profile。
# ==============================================================================

spring:
  config:
    import: classpath:aftersale-catalog.yml

pet:
  auth:
    admin:
      enabled: true
    c:
      enabled: true
  private-assets:
    enabled: true
  merchant:
    application:
      open-cities:
        - code: chengdu
          name: 成都
  payment:
    enabled: true
    dispatch:
      environment: ${LAKALA_ENV:PRODUCTION}
    lakala:
      settle-type: ${LAKALA_SETTLE_TYPE:1}
    center:
      demo:
        enabled: false
  marketing:
    asset:
      allow-http: false
  service:
    category:
      icon-url-allow-http: false
    flash-price:
      enabled: true
