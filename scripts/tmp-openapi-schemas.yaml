          type: [string, 'null']
        latitude:
          type: [string, 'null']
        merchantStatus:
          type: string
          enum: [APPLYING, ACTIVE, OFFLINE, FROZEN, CANCELED]
        storeStatus:
          type: string
          enum: [ACTIVE, OFFLINE, FROZEN]
        operatingStatus:
