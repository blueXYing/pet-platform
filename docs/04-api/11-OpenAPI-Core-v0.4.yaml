          $ref: '#/components/schemas/PublicId'
        petId:
          $ref: '#/components/schemas/PublicId'
        fulfillmentType:
          $ref: '#/components/schemas/FulfillmentType'
        appointmentStart:
          type: string
          format: date-time
          x-precision: milliseconds
          description: 带偏移ISO-8601；服务端拒绝非零亚毫秒，不截断或舍入。
        appointmentEnd:
          type: string
          format: date-time
          x-precision: milliseconds
          description: 带偏移ISO-8601；服务端拒绝非零亚毫秒，不截断或舍入。
        pickupStart:
          type: string
          format: date-time
          x-precision: milliseconds
          description: 带偏移ISO-8601；服务端拒绝非零亚毫秒，不截断或舍入。
          nullable: true
        returnStart:
          type: string
          format: date-time
          x-precision: milliseconds
