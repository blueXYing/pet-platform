    MerAgreementView:
      oneOf:
      - type: object
        additionalProperties: false
        required:
        - merchantId
        - agreementVersion
        - content
        - contentSha256
        - signingStatus
        properties:
          merchantId: &id005
            $ref: '#/components/schemas/PublicId'
          agreementVersion: &id006
            $ref: '#/components/schemas/MerAgreementVersion'
          content: &id007
            type: string
            minLength: 1
            maxLength: 65535
            description: UTF-8 plain text; server additionally enforces <=65535 bytes.
          contentSha256: &id008
            $ref: '#/components/schemas/MerContentHash'
          signingStatus:
            type: string
            enum:
            - NOT_SIGNED
      - type: object
        additionalProperties: false
        required:
        - merchantId
        - agreementVersion
        - content
        - contentSha256
        - signingStatus
        - acceptedVersion
        - acceptedAt
        properties:
          merchantId: *id005
          agreementVersion: *id006
          content: *id007
          contentSha256: *id008
          signingStatus:
            type: string
            enum:
            - SIGNED
          acceptedVersion:
            $ref: '#/components/schemas/MerAgreementVersion'
          acceptedAt:
            $ref: '#/components/schemas/AuthTimestamp'
    MerStaffPage:
