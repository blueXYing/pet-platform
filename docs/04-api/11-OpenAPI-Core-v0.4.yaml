      description: Contract 46; NOT_IMPLEMENTED HTTP. Real USER session and current order version required. Minute-aligned times; unchanged intervals conflict without consuming the chance.
      required: [expectedOrderVersion]
      oneOf:
      - required: [appointmentStart, appointmentEnd, selectedGeneralWindowId]
        not:
          anyOf:
          - required: [pickupStart]
          - required: [returnStart]
          - required: [selectedPickupWindowId]
          - required: [selectedReturnWindowId]
      - required: [pickupStart, returnStart, selectedPickupWindowId, selectedReturnWindowId]
        not:
