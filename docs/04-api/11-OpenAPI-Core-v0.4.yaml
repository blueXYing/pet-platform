    AppStatus:
      type: string
      enum:
      - DRAFT
      - REVIEWING
      - APPROVED
      - REJECTED
    AppApplicationNo:
      type: string
      pattern: ^SQ[0-9]{8}[A-Za-z0-9]{8}(?![\s\S])
      minLength: 18
      maxLength: 18
      description: PRD human-readable SQ + YYYYMMDD + 8-character random code; generated
        on first submit, not a Snowflake ID.
    AppMerchantType:
      type: string
      enum:
      - PET_LIFE_STORE
      - PET_HOSPITAL
      - PET_GROOMING
      - PET_BOARDING
      - PET_TRAINING
      - OTHER
    AppCityCode:
      type: string
      minLength: 1
      maxLength: 32
      description: Opaque key from the enabled city directory; checked server-side.
    AppCoordinate:
      type: string
      pattern: ^-?(0|[1-9][0-9]{0,2})(\.[0-9]{1,7})?(?![\s\S])
      description: Decimal String, at most 7 places; runtime bounds longitude [-180,180],
        latitude [-90,90].
    AppDraftInput:
      type: object
      additionalProperties: false
      required: []
      properties:
        merchantName:
          type: string
          nullable: true
          maxLength: 50
          default: null
        contactName:
          type: string
          nullable: true
          maxLength: 20
          default: null
        contactPhone:
          type: string
          nullable: true
          maxLength: 11
          default: null
        email:
          type: string
          nullable: true
          maxLength: 254
          default: null
        merchantTypeCode:
          type: string
          nullable: true
          enum:
          - PET_LIFE_STORE
          - PET_HOSPITAL
          - PET_GROOMING
          - PET_BOARDING
          - PET_TRAINING
          - OTHER
          - null
          default: null
        cityCode:
          type: string
          nullable: true
          maxLength: 32
          default: null
        address:
          type: string
          nullable: true
          maxLength: 255
          default: null
        longitude:
          type: string
          pattern: ^-?(0|[1-9][0-9]{0,2})(\.[0-9]{1,7})?(?![\s\S])
          description: Decimal String, at most 7 places; runtime bounds longitude [-180,180],
            latitude [-90,90].
          nullable: true
          default: null
        latitude:
          type: string
          pattern: ^-?(0|[1-9][0-9]{0,2})(\.[0-9]{1,7})?(?![\s\S])
          description: Decimal String, at most 7 places; runtime bounds longitude [-180,180],
            latitude [-90,90].
          nullable: true
          default: null
        introduction:
          type: string
          nullable: true
          maxLength: 500
          default: null
        storePhotoAssetIds:
          type: array
          items:
            $ref: '#/components/schemas/PublicId'
          maxItems: 6
          uniqueItems: true
          default: []
        businessLicenseAssetId:
          type: string
          minLength: 1
          maxLength: 19
          pattern: ^[1-9][0-9]{0,18}(?![\s\S])
          x-maximum-decimal: '9223372036854775807'
          description: 正Long ASCII String；pattern只校验词法和位数，Long上界由服务端PublicIdCodec检查，禁止JS
