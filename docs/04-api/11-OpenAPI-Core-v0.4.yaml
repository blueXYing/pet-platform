        changeType=CONFIRMED. The phone only travels in the pre-masked owner-visible form; no
        plaintext phone. ownerUserId (INVITED/CANCELED receiver) and confirmedUserId (CONFIRMED
        employee receiver) keep the notification consumer self-contained.

