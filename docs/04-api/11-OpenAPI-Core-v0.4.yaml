  /c/services/{serviceId}/availability:
    get:
      tags:
      - Schedule-Availability
      operationId: cGetServiceAvailability
      summary: Minute-level windows with verified staff capacity (SCH-001/SCH-002)
      x-contract-status: IMPLEMENTED_DEFAULT_OFF
      x-audience: MINIAPP
      # SCH-D1 (schedule ruling 2026-09-23): login is mandatory - this route is OUTSIDE the
      # STR-D8 anonymous browse family. The switch pet.schedule.query.enabled defaults to off
      # with the real SCH-002 staff/capability/availability provider assembled. Missing or unreadable
      # facts still fail closed with 503; confirmed empty facts give zero capacity. This is a read
      # projection, not the SCH-003 booking/concurrency authority.
      security:
      - bearerAuth: []
      parameters:
      - name: serviceId
        in: path
        required: true
        schema:
          type: string
      - name: storeId
        in: query
        required: true
        schema:
          type: string
      - name: startDate
        in: query
        required: true
        schema:
          type: string
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
      - name: endDate
        in: query
        required: true
        schema:
          type: string
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
      - name: kind
        in: query
        required: false
        description: 'Accepted only when pet.schedule.selection.enabled=true (Contract 39). Must match the service fulfillment type.'
        schema:
          type: string
          enum: [GENERAL, PICKUP, RETURN]
      responses:
        '200':
          description: 'Minute-level OPEN windows, start-ascending, rendered in the business
            zone (+08:00); see HTTP contract 10 section 3.4. items elements carry only
            start/end/effectiveCapacity/occupiedCount/remainingCapacity/available.
            With pet.schedule.selection.enabled=true each item also contains windowId (decimal String)
            and kind (GENERAL/PICKUP/RETURN); counts use claims and remain original-window display only,
            not final booking feasibility. See Contract 39.'
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerErrorEnvelope'
        '400':
          description: Invalid ids, date format, ordering or a span beyond 31 days.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerErrorEnvelope'
        '401':
          description: Missing, invalid or expired MINIAPP bearer (mandatory session, SCH-D1).
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerErrorEnvelope'
        '404':
          description: Not found, not visible, ineligible or store mismatch (indistinguishable);
            code SERVICE_NOT_FOUND.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerErrorEnvelope'
        '503':
          description: Facts source failure, unknown status, or the qualified-staff facts
            provider absent before SCH-002 - fail closed, never a placeholder capacity.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerErrorEnvelope'
