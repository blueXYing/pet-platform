          pattern: '^(0|[1-9][0-9]*)$'
          description: Nonnegative signed BIGINT decimal string. Not a public entity ID.
        appointmentStart:
          type: string
          format: date-time
          x-precision: milliseconds
          description: Offset ISO-8601; seconds and fractional seconds must both be zero.
        appointmentEnd:
          type: string
          format: date-time
          x-precision: milliseconds
          description: Offset ISO-8601; seconds and fractional seconds must both be zero.
        pickupStart:
