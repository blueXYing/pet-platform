        '403':
          description: Action denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateAssetErrorEnvelope'
        '404':
          description: Resource unavailable in current scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateAssetErrorEnvelope'
        '409':
          description: Conflict or upload awaiting reconciliation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateAssetErrorEnvelope'
        '410':
          description: Grant expired or consumed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateAssetErrorEnvelope'
        '503':
          description: Dependency unavailable; fail closed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateAssetErrorEnvelope'
  /admin/private-asset-read-grants/{token}:
    get:
      tags:
      - Private-Asset
      security:
      - bearerAuth: []
      x-contract-status: APPROVED_IMPLEMENTATION_CANDIDATE
      x-default-enabled: false
      operationId: consumePrivateAssetReadGrant
      x-single-use: true
      x-grant-ttl-seconds: 300
      x-recheck-current-authorization: true
      summary: Consume single-use grant and return watermarked JPEG or PNG
      x-audience: ADMIN_WEB
      description: Recheck current session generation, actions, scope, claimant and linked material. TTL five minutes.
        Consumed grant cannot replay. Never log raw token path. No OSS URL.
      parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
          minLength: 32
          maxLength: 512
          pattern: ^[A-Za-z0-9_-]+$
      responses:
        '200':
          description: Watermarked JPEG/PNG preserving the normalized object encoding; no raw material bytes.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store, private
            Pragma:
              schema:
                type: string
                enum:
                - no-cache
            X-Content-Type-Options:
              schema:
                type: string
                enum:
                - nosniff
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid upload or confirmation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateAssetErrorEnvelope'
        '401':
          description: Current session required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateAssetErrorEnvelope'
        '403':
          description: Action denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateAssetErrorEnvelope'
        '404':
          description: Resource unavailable in current scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateAssetErrorEnvelope'
        '409':
          description: Conflict or upload awaiting reconciliation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateAssetErrorEnvelope'
        '410':
