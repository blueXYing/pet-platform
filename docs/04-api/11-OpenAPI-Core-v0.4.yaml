openapi: 3.0.3
info:
  title: Pet Platform V1.0 Core API
  version: 0.4.0
  description: '宠物平台 V1.0 核心交易 OpenAPI 草案。 完整业务语义以产品 SSOT、技术基线与 HTTP Controller Contract
    为准。

    '
servers:
- url: /api/v1
tags:
- name: C-Order
- name: C-Refund
- name: C-Aftersale
- name: Merchant-Aftersale
- name: C-Review
- name: Merchant-Order
- name: Merchant-Refund
- name: Merchant-Verification
- name: Admin-Aftersale
- name: Admin-Order
- name: AUTH-Miniapp
- name: AUTH-Admin
- name: Merchant-Profile
- name: Merchant-Application
- name: Private-Asset
paths:
  /c/orders/{orderId}/verification-code:
    get:
      tags:
      - C-Order
      operationId: getOrderVerificationCredential
      summary: Read current credential
      x-implementation-status: IMPLEMENTED_DEFAULT_OFF
      x-default-enabled: false
      x-contract: 47-Verification-Credential-Contract-v0.1.md
      x-assembly-switch: pet.verification.credential.http.enabled
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: 'Contract 47 §4 view (this slice): read-only, never creates state or
            extends validity; Cache-Control: no-store, the code is never cached or logged.'
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/BaseEnvelope'
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      $ref: '#/components/schemas/VerificationCredentialView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
    post:
      tags:
      - C-Order
      operationId: issueOrderVerificationCredential
      summary: Issue or refresh a credential
      x-implementation-status: IMPLEMENTED_DEFAULT_OFF
      x-default-enabled: false
      x-contract: 47-Verification-Credential-Contract-v0.1.md
      x-assembly-switch: pet.verification.credential.http.enabled
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/OrderId'
      - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 'Contract 47 §4 issue/refresh (this slice): five-tuple requestId
            idempotency, protected first-receipt replay, a refresh retires the old code;
            Cache-Control: no-store.'
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/BaseEnvelope'
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      $ref: '#/components/schemas/VerificationCredentialReceipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          description: Manual refresh quota exceeded
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationCredentialIssue'
  /c/private-assets:
    post:
      tags:
      - Private-Asset
      security:
      - bearerAuth: []
      x-contract-status: APPROVED_IMPLEMENTATION_CANDIDATE
      x-default-enabled: false
      operationId: uploadPrivateAsset
      summary: Upload private merchant application material
      x-audience: MINIAPP
      parameters:
      - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required:
              - purpose
              - file
              properties:
                purpose:
                  type: string
                  enum:
                  - MERCHANT_APPLICATION_MATERIAL
                file:
                  type: string
                  format: binary
                  description: JPEG/PNG, original and normalized object each <=10MiB; actual decode and malware check
                    required.
      responses:
        '200':
          description: Current authorized receipt; no private object location.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateAssetUploadEnvelope'
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store, private
        '201':
          description: Current authorized receipt; no private object location.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateAssetUploadEnvelope'
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store, private
        '400':
          description: Invalid upload or confirmation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateAssetErrorEnvelope'
        '401':
          description: Current session required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateAssetErrorEnvelope'
        '403':
          description: Action denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateAssetErrorEnvelope'
        '404':
          description: Resource unavailable in current scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateAssetErrorEnvelope'
        '409':
          description: Conflict or upload awaiting reconciliation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateAssetErrorEnvelope'
        '413':
          description: Upload too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateAssetErrorEnvelope'
        '415':
          description: Unsupported content type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateAssetErrorEnvelope'
        '422':
          description: PRIVATE_ASSET_REJECTED; bound upload is terminal REJECTED or QUARANTINED. Explicit reselection uses a new UUID; never overwrites the original binding.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateAssetErrorEnvelope'
        '503':
          description: Dependency unavailable; fail closed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateAssetErrorEnvelope'
