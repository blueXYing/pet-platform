    MerchantStaffGrantLifecyclePayload:
      type: object
      additionalProperties: false
      required:
      - memberId
      - merchantId
      - storeId
      - memberUserId
      - changeType
      - actions
      - occurredAt
      properties:
        memberId:
          $ref: '#/components/schemas/PublicId'
        merchantId:
          $ref: '#/components/schemas/PublicId'
        storeId:
          $ref: '#/components/schemas/PublicId'
        memberUserId:
          $ref: '#/components/schemas/PublicId'
