    DisplayOrderStatus:
      type: string
      enum:
      - PENDING_PAYMENT
      - PENDING_CONFIRM
      - PENDING_SERVICE
      - COMPLETED
      - CANCELED
      - REFUND_PENDING_CONFIRM
      - REFUNDING
      - REFUNDED
      - PARTIAL_REFUND
      - AFTERSALE
    FulfillmentType:
      type: string
      enum:
      - IN_STORE
      - PICKUP_DELIVERY
    PublicId:
      type: string
      minLength: 1
      maxLength: 19
      pattern: '^[1-9][0-9]{0,18}(?![\s\S])'
      x-maximum-decimal: '9223372036854775807'
      description: 正Long ASCII String；pattern只校验词法和位数，Long上界由服务端PublicIdCodec检查，禁止JS Number。
      example: '9007199254740993'
    DecimalAmount:
      type: string
      pattern: '^(?:0|[1-9][0-9]{0,15})(?:\.[0-9]{1,2})?(?![\s\S])'
      description: 既有业务非负金额输入；最多16位整数，不舍入；正数及退款上限仍按业务资格。
      example: '128.00'
    DecimalAmountOutput:
      type: string
      pattern: '^(?:0|[1-9][0-9]{0,15})\.[0-9]{2}(?![\s\S])'
      description: 既有业务非负金额输出固定两位；公共Codec负数支持不放宽业务字段。
      example: '128.00'
    CreateOrderRequest:
