                $ref: '#/components/schemas/MerErrorEnvelope'
        '409':
          description: Contract 30; never includes old sensitive data.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerErrorEnvelope'
        '503':
          description: Contract 30; never includes old sensitive data.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerErrorEnvelope'
      x-required-actions:
      - merchant.application.decide
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppDecisionRequest'
      x-requires-current-claimant: true
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    authAttempt:
      type: apiKey
      in: header
      name: X-Auth-Attempt
      description: Restricted authentication-attempt secret, not a business Bearer or client asserted identity.
    adminBinding:
      type: apiKey
      in: cookie
      name: __Host-pet-admin-attempt
      description: Same-origin Secure HttpOnly SameSite=Strict request binding; checked together with Origin and attempt
        secret, not an extra authentication factor.
  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: true
      schema:
        type: string
        format: uuid
        minLength: 36
        maxLength: 36
        pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}(?![\s\S])'
      description: 终端完整UUID原值保留；同意图重试复用，不trim或改大小写；内部确定性串不适用本header。
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/PublicId'
    ApplicationId:
      name: applicationId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/PublicId'
    AfterSaleId:
      name: afterSaleId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/PublicId'
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    AuthOrigin:
      name: Origin
      in: header
      required: true
      schema:
        type: string
        minLength: 1
      description: Must equal configured trusted admin origin; not a client chosen authorization fact.
    AuthOriginalRequestId:
      name: requestId
      in: query
      required: false
      schema:
        type: string
        format: uuid
        minLength: 36
        maxLength: 36
        pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}(?![\s\S])
      description: Original command UUID for result recovery; not a new GET idempotency key.
  responses:
    Conflict:
      description: 业务状态/并发/幂等冲突。异参IDEMPOTENCY_KEY_CONFLICT不得覆盖；争锁忙COMMON_CONFLICT且data为null，原key稍后重试，不将所有409自动重试。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: 当前会话无效；不返回旧回执data。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: 当前动作或数据范围无权；不返回旧敏感data。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    DependencyUnavailable:
      description: 数据库或旧回执设施不可用；保留原key，不重做业务。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    PrivateAssetUploadResult:
      type: object
      additionalProperties: false
      required:
      - assetId
      - status
      - objectSha256
      - mediaType
      - bytes
      properties:
        assetId:
          $ref: '#/components/schemas/PublicId'
        status:
          type: string
          enum:
          - READY
        objectSha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        mediaType:
          type: string
          enum:
          - image/png
          - image/jpeg
        bytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 10485760
    PrivateAssetUploadEnvelope:
      type: object
      additionalProperties: false
      required:
      - success
      - code
      - message
      - data
      - traceId
      properties:
        success:
          type: boolean
          enum:
          - true
        code:
          type: string
          enum:
          - SUCCESS
        message:
          type: string
          minLength: 1
        data:
          $ref: '#/components/schemas/PrivateAssetUploadResult'
        traceId:
          type: string
          minLength: 1
    PrivateAssetGrantRequest:
      type: object
      additionalProperties: false
      required:
      - submissionRevisionId
      - purposeCode
      - reason
      - confirmed
      properties:
        submissionRevisionId:
          $ref: '#/components/schemas/PublicId'
        purposeCode:
          type: string
          pattern: ^[A-Z][A-Z0-9_]{0,63}$
        reason:
          type: string
          minLength: 10
          maxLength: 500
        confirmed:
          type: boolean
          enum:
          - true
    PrivateAssetGrantResult:
      type: object
      additionalProperties: false
      required:
      - readUrl
      - expiresAt
      properties:
        readUrl:
          type: string
          pattern: ^/api/v1/admin/private-asset-read-grants/[A-Za-z0-9_-]+$
        expiresAt:
          type: string
          format: date-time
    PrivateAssetGrantEnvelope:
      type: object
      additionalProperties: false
      required:
      - success
      - code
      - message
      - data
      - traceId
      properties:
        success:
          type: boolean
          enum:
          - true
        code:
          type: string
          enum:
          - SUCCESS
        message:
          type: string
          minLength: 1
        data:
          $ref: '#/components/schemas/PrivateAssetGrantResult'
        traceId:
          type: string
          minLength: 1
    PrivateAssetErrorEnvelope:
      type: object
      additionalProperties: false
      required:
      - success
      - code
      - message
      - data
      - traceId
      properties:
        success:
          type: boolean
          enum:
          - false
        code:
          type: string
          enum:
          - COMMON_INVALID_ARGUMENT
          - COMMON_UNAUTHORIZED
          - COMMON_FORBIDDEN
          - COMMON_NOT_FOUND
          - COMMON_CONFLICT
          - IDEMPOTENCY_KEY_CONFLICT
          - COMMON_DEPENDENCY_UNAVAILABLE
          - PRIVATE_ASSET_NOT_READY
          - PRIVATE_ASSET_REJECTED
          - PRIVATE_ASSET_GRANT_GONE
        message:
          type: string
          minLength: 1
        data:
          type: object
          nullable: true
          enum:
          - null
        traceId:
          type: string
          minLength: 1
    MerVersion:
      type: string
      pattern: '^(0|[1-9][0-9]{0,18})(?![\s\S])'
      description: Nonnegative Long as String; server checks <=9223372036854775807.
    MerAgreementVersion:
      type: string
      pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}(?![\s\S])'
      minLength: 1
      maxLength: 64
    MerContentHash:
      type: string
      pattern: ^[a-f0-9]{64}$
      minLength: 64
      maxLength: 64
    MerPhone:
      type: string
      nullable: true
      pattern: '^1[0-9]{10}(?![\s\S])'
      minLength: 11
      maxLength: 11
      description: Explicit null or omission on PUT clears phone; never binds an account.
    MerStaffView:
      type: object
      additionalProperties: false
      required:
      - merchantId
      - storeId
      - staffId
      - staffName
      - phoneMasked
      - employmentStatus
      - serviceEnabled
      - version
      properties:
        merchantId: &id001
          $ref: '#/components/schemas/PublicId'
        storeId: &id002
          $ref: '#/components/schemas/PublicId'
        staffId:
          $ref: '#/components/schemas/PublicId'
        staffName: &id003
          type: string
          minLength: 1
          maxLength: 64
          pattern: \S
        phoneMasked:
          type: string
          nullable: true
          maxLength: 32
        employmentStatus: &id004
          type: string
          enum:
          - ACTIVE
          - INACTIVE
        serviceEnabled:
          type: boolean
        version:
          $ref: '#/components/schemas/MerVersion'
    MerStaffCreateRequest:
      type: object
      additionalProperties: false
      required:
      - merchantId
